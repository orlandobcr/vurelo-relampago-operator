<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login · Vurelo Operator</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="logo-row">
      <svg width="48" height="48" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 12 L32 52 L26 52 L8 14 Z" fill="#7c3aed" />
        <path d="M50 12 L32 52 L26 52 L44 12 Z" fill="#a78bfa" />
      </svg>
    </div>

    <h1>vurelo · operator</h1>
    <p class="muted">Solo cuentas <strong>@vureloapp.com</strong> pueden acceder.</p>

    {% if err %}
      <div class="msg err" style="margin: 16px 0; text-align: left;">
        ✗ {{ err }}
      </div>
    {% endif %}

    {% if google_configured %}
      <a href="/api/auth/google/start?next={{ next_url|urlencode }}" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuar con Google
      </a>
    {% else %}
      <div class="msg err" style="margin: 16px 0;">
        Google OAuth no configurado · falta GOOGLE_CLIENT_ID/SECRET en el server.
      </div>
    {% endif %}

    <div class="login-footer">
      DigitALL PRO · Vurelo Relampago Operator
    </div>
  </div>
</div>

</body>
</html>
